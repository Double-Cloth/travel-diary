<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Travel Diary</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b160f'/%3E%3Cpath d='M32 7l5.6 18.7L57 32l-19.4 6.3L32 57l-5.6-18.7L7 32l19.4-6.3L32 7z' fill='%23d8b467'/%3E%3C/svg%3E">
    <link rel="preload" as="image" href="assets/images/pages/leather-mountain-cover.png">
    <link rel="stylesheet" href="css/journal.css?v=20260924-entry-neighbors-v1">
</head>
<body>
    <a class="skip-link" href="#journalStage">跳到档案内容</a>

    <div class="journal-shell" id="appShell" data-route="cover">
        <header class="journal-spine" aria-label="旅行档案章节">
            <a class="brand-lockup" href="#cover" aria-label="合上旅行手记" title="合上旅行手记">
                <span>
                    <strong>Travel Diary</strong>
                    <small>旅行档案 · 记录每一段时光</small>
                </span>
            </a>

            <nav class="chapter-tabs" id="chapterTabs" aria-label="章节导航">
                <a href="#cover" class="chapter-tab" data-route-link="cover">
                    <span class="chapter-icon" aria-hidden="true">封</span>
                    <span>封面</span>
                </a>
                <a href="#ledger" class="chapter-tab" data-route-link="ledger">
                    <span class="chapter-icon" aria-hidden="true">路</span>
                    <span>旅行路径</span>
                </a>
                <a href="#archive" class="chapter-tab" data-route-link="archive">
                    <span class="chapter-icon" aria-hidden="true">档</span>
                    <span>个人主页</span>
                </a>
            </nav>

            <div class="spine-tools" aria-label="快捷入口">
                <button class="spine-tool spine-add" type="button" data-action="add-record" aria-label="新增旅行记录" title="新增旅行记录">
                    <svg class="spine-add-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                </button>
                <span class="tool-divider" aria-hidden="true"></span>
                <button class="spine-tool spine-profile" type="button" data-action="upload-profile-picture" aria-label="更换头像" title="点击更换头像">
                    <span class="spine-profile-fallback" aria-hidden="true">旅</span>
                    <img data-src="data/profile/profile-picture.png" alt="" aria-hidden="true" hidden>
                </button>
                <input id="profilePictureInput" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
            </div>
        </header>

        <main class="journal-stage" id="journalStage" tabindex="-1">
            <section class="notebook" aria-live="polite">
                <span class="book-corner-hardware book-corner-top-left" aria-hidden="true"></span>
                <span class="book-corner-hardware book-corner-top-right" aria-hidden="true"></span>
                <span class="book-corner-hardware book-corner-bottom-left" aria-hidden="true"></span>
                <span class="book-corner-hardware book-corner-bottom-right" aria-hidden="true"></span>
                <div class="book-page-stack book-page-stack-left" aria-hidden="true"></div>
                <div class="book-page-stack book-page-stack-right" aria-hidden="true"></div>
                <div class="book-ribbon" aria-hidden="true"></div>
                <button class="closed-book-cover" id="closedBookCover" type="button" data-action="open-book" aria-label="翻开旅行手记">
                    <span class="closed-book-spine" aria-hidden="true"></span>
                    <span class="closed-book-stitching" aria-hidden="true"></span>
                    <span class="closed-book-corner closed-book-corner-top" aria-hidden="true"></span>
                    <span class="closed-book-corner closed-book-corner-bottom" aria-hidden="true"></span>
                    <span class="closed-book-title">旅行手记</span>
                    <span class="closed-book-subtitle">TRAVEL DIARY</span>
                    <span class="closed-book-invitation">翻开，继续这段旅程</span>
                    <span class="closed-book-clasp" aria-hidden="true"><i></i></span>
                </button>
                <div class="page-spread" id="pageSpread">
                    <section class="paper-page paper-page-left" id="leftPage" aria-label="左页"></section>
                    <section class="paper-page paper-page-right" id="rightPage" aria-label="右页"></section>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/app.js?v=20260924-entry-neighbors-v1"></script>
</body>
</html>
