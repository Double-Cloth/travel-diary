name: Test

on:
  push:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Prepare font cache
        run: npm run fonts

      - name: Run tests
        run: npm test

  container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Check deployment shell syntax
        run: |
          for file in scripts/deploy.sh scripts/offline-images.sh install.sh; do bash -n "$file"; done
          sh -n deploy/entrypoint.sh
      - name: Build isolated image
        run: docker build -t travel-diary:verification .
      - name: Verify containers with synthetic data
        run: npm run test:deployment
      - name: Prepare offline bundle before disconnecting
        run: |
          docker pull caddy:2-alpine
          docker build -f tests/fixtures/Dockerfile.offline -t travel-diary:offline-test-tools .
          node scripts/package-deployment.mjs --offline --local --tag verification --image travel-diary:verification
      - name: Verify installation and upgrades without internet
        run: node scripts/test-offline-deployment.mjs dist/travel-diary-offline-linux-*-verification.tar.gz
      - name: Verify shared gateway and Portal lifecycle without internet
        run: npm run test:portal -- dist/travel-diary-offline-linux-*-verification.tar.gz
