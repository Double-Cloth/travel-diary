name: Deploy GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install font tools
        run: pip install "fonttools[woff]"

      - name: Install dependencies
        run: npm ci

      - name: Build full fonts
        run: npm run fonts

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install font tools
        run: pip install "fonttools[woff]"

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build full fonts
        run: npm run fonts

      - name: Prepare static site
        run: |
          mkdir -p _site/data/travel-diary _site/data/photos _site/data/videos _site/data/profile
          cp index.html _site/
          cp -R api assets css doc js _site/
          if [ -d data ]; then cp -R data/. _site/data/; fi
          if [ ! -f _site/data/travel_data.json ]; then printf '[]\n' > _site/data/travel_data.json; fi
          if [ ! -f _site/data/profile/profile-picture.png ]; then printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a5uoAAAAASUVORK5CYII=' | base64 --decode > _site/data/profile/profile-picture.png; fi
          find _site/assets/fonts -name '*.ttf' -delete
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
